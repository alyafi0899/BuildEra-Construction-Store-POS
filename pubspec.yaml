name: buildera
description: "Material and Construction POS - Bangun. Kelola. Kembangkan."
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.1
  flutter_riverpod: ^3.3.1
  intl: ^0.20.2
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  fl_chart: 1.0.0
  collection: ^1.18.0
  file_picker: ^8.1.7
  excel: ^4.0.6
  shared_preferences: ^2.5.3
  window_manager: ^0.4.3
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  image: ^4.3.0
  image_cropper: ^8.1.0
  image_picker: ^1.1.2
  path: ^1.9.0
  barcode: ^2.2.7
  barcode_widget: ^2.0.4
  qr_flutter: ^4.1.0
  open_filex: ^4.5.0
  mobile_scanner: ^6.0.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  win32: ^5.15.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  msix: ^3.16.7

msix_config:
  display_name: BuildEra
  publisher_display_name: Solutivo Studio
  identity_name: com.solutivo.buildera
  publisher: CN=Solutivo Studio
  msix_version: 1.0.0.0
  logo_path: assets/images/logo.png
  capabilities: internetClient, location, privateNetworkClientServer, broadFileSystemAccess
  install_certificate: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1B1D29"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#1B1D29"
    theme_color: "#1B1D29"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
